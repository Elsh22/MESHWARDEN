[workspace]
resolver = "3"
members = [
    "crates/mw-crypto",
    "crates/mw-proto",
    "crates/mw-identity",
    "crates/mw-policy",
    "crates/mw-task",
    "crates/mw-audit",
    "crates/mw-transport",
    "crates/mw-discovery",
    "crates/mw-trust",
    "crates/mw-sandbox",
    "crates/mw-store",
    "crates/mw-telemetry",
    "crates/mw-testkit",
    "bin/mw-agent",
    "bin/mw-ca",
    "bin/mw-control",
    "bin/mw-cli",
    "bin/mw-sim",
    "workloads/wl-sensor-agg",
    "workloads/wl-maptile",
    "workloads/wl-montecarlo",
    "workloads/wl-telemetry",
    "workloads/wl-challenge",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "TODO"          # pick one before wiring deny.toml licenses to it

[workspace.dependencies]
# Near-term deps. Verify latest with `cargo add <crate>` in the owning crate.
tokio         = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
# ADR-016: no built-in (C-backed) provider — default features off, rustls-rustcrypto installed as default.
rustls            = { version = "0.23", default-features = false, features = ["std"] }
rustls-rustcrypto = "0.0.2-alpha"
tokio-rustls      = { version = "0.26", default-features = false }
# default-features off: rcgen's built-in backends are ring/aws-lc-rs (ADR-016 gate); we bring our own signer.
rcgen             = { version = "0.14", default-features = false }
p256              = "0.13"
ed25519-dalek = "2"
x25519-dalek  = "2"
sha2          = "0.10"
rand_core     = { version = "0.6", features = ["getrandom"] }
axum          = "0.8"
thiserror     = "2"
anyhow        = "1"
serde         = { version = "1", features = ["derive"] }
postcard      = { version = "1", features = ["use-std"] }
data-encoding = "2"
